<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guildCTA - 실시간 길드 매칭 현황판</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    
    /* 초대코드 모달 스타일 */
    #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-box { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; width: 320px; }
    .auth-box h2 { margin-top: 0; color: #38bdf8; font-size: 1.3rem; }
    .auth-box input { width: 100%; padding: 10px; margin: 15px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 1rem; text-align: center; }
    .auth-box button { width: 100%; padding: 10px; background: #38bdf8; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color: #0f172a; }
    .auth-box button:hover { background: #0ea5e9; }
    .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 5px; display: none; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
    .btn-reset { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-reset:hover { background-color: #dc2626; }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .party-card { background-color: #1e293b; border-radius: 8px; padding: 16px; border: 1px solid #334155; }
    .party-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; color: #facc15; border-bottom: 2px solid #334155; padding-bottom: 6px; }
    
    .slot-row { display: flex; flex-direction: column; gap: 6px; background-color: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #334155; }
    .slot-row input, .slot-row select { background-color: #1e293b; color: #f8fafc; border: 1px solid #475569; padding: 6px; border-radius: 4px; font-size: 0.9rem; }
    .slot-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #94a3b8; }
    
    /* 출결 체크박스 스타일 */
    .checkbox-label { display: flex; align-items: center; gap: 4px; color: #4ade80; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .checkbox-label input { width: 16px; height: 16px; cursor: pointer; }

    .slot-inputs { display: flex; gap: 6px; }
    .slot-inputs input[type="text"] { flex: 1; }
    .readonly-comment { background-color: #090d16 !important; color: #64748b !important; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- 초대코드 입력 모달 -->
  <div id="auth-modal">
    <div class="auth-box">
      <h2>🔒 초대코드 입력</h2>
      <p style="font-size: 0.85rem; color: #94a3b8; margin: 0;">접속하려면 초대코드를 입력하세요.</p>
      <input type="password" id="invite-input" placeholder="초대코드 입력" onkeydown="if(event.key==='Enter') verifyCode()" />
      <button onclick="verifyCode()">입장하기</button>
      <div id="error-msg" class="error-msg">초대코드가 틀렸습니다.</div>
    </div>
  </div>

  <div class="header">
    <h1>⚔️ guildCTA 실시간 매칭 현황판</h1>
    <button class="btn-reset" onclick="resetAll()">전체 초기화</button>
  </div>

  <div id="app" class="grid-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentData = { slots: [], guilds: [] };

    // 접속 시 세션 체크
    window.onload = function() {
      if (sessionStorage.getItem('guildCTA_auth') === 'true') {
        document.getElementById('auth-modal').style.display = 'none';
      }
    };

    function verifyCode() {
      const code = document.getElementById('invite-input').value;
      socket.emit('verifyCode', code, (res) => {
        if (res.success) {
          sessionStorage.setItem('guildCTA_auth', 'true');
          document.getElementById('auth-modal').style.display = 'none';
        } else {
          const errDiv = document.getElementById('error-msg');
          errDiv.style.display = 'block';
          errDiv.innerText = res.message;
        }
      });
    }

    socket.on('dataUpdated', (data) => {
      currentData = data;
      render();
    });

    function render() {
      const container = document.getElementById('app');
      container.innerHTML = '';

      const parties = {};
      currentData.slots.forEach(slot => {
        if (!parties[slot.party]) parties[slot.party] = [];
        parties[slot.party].push(slot);
      });

      Object.keys(parties).forEach(partyName => {
        const card = document.createElement('div');
        card.className = 'party-card';
        
        let html = `<div class="party-title">${partyName}</div>`;
        parties[partyName].forEach(slot => {
          const guildOptions = currentData.guilds.map(g => 
            `<option value="${g}" ${slot.guild === g ? 'selected' : ''}>${g}</option>`
          ).join('');

          html += `
            <div class="slot-row">
              <div class="slot-header">
                <span><strong>${slot.displayIndex}번</strong></span>
                <label class="checkbox-label">
                  <input type="checkbox" ${slot.attended ? 'checked' : ''} onchange="updateSlot('${slot.id}', 'attended', this.checked)">
                  출석체크
                </label>
              </div>
              <div class="slot-inputs">
                <input type="text" placeholder="닉네임" value="${escapeHtml(slot.nickname)}" onchange="updateSlot('${slot.id}', 'nickname', this.value)" />
                <select onchange="updateSlot('${slot.id}', 'guild', this.value)">
                  ${guildOptions}
                </select>
              </div>
              <input type="text" class="readonly-comment" value="${escapeHtml(slot.comment || '메모/코멘트 (읽기 전용)')}" disabled />
            </div>
          `;
        });

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function updateSlot(id, key, value) {
      const slot = currentData.slots.find(s => s.id === id);
      if (slot) {
        slot[key] = value;
        socket.emit('updateSlot', slot);
      }
    }

    function resetAll() {
      if (confirm('모든 입력 데이터를 초기화하시겠습니까?')) {
        socket.emit('resetData');
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>

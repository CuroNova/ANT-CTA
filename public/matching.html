<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANT CTA</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
    .btn-reset { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-reset:hover { background-color: #dc2626; }

    /* 파티 탭 */
    .party-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid #334155; padding-bottom: 4px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    /* 엑셀 스타일 테이블 */
    .excel-container { overflow-x: auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    table.sheet-table { width: 100%; border-collapse: collapse; table-layout: auto; text-align: left; }
    table.sheet-table th { background: #0f172a; color: #38bdf8; padding: 10px 8px; font-size: 0.88rem; border-bottom: 2px solid #334155; border-right: 1px solid #1e293b; white-space: nowrap; }
    table.sheet-table td { padding: 6px 8px; border-bottom: 1px solid #334155; border-right: 1px solid #1e293b; vertical-align: middle; }
    table.sheet-table tr:hover { background-color: #273549; }

    /* 알비온 아이템 이미지 스타일 */
    .weapon-cell { display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .item-img { width: 32px; height: 32px; object-fit: contain; background: #0f172a; border-radius: 4px; border: 1px solid #334155; padding: 2px; flex-shrink: 0; }

    /* 입력 요소 스타일 */
    input[type="text"], select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 5px 6px; border-radius: 4px; font-size: 0.85rem; }
    select { padding-right: 2px; text-align: center; }
    .readonly-comment { background-color: #090d16 !important; color: #64748b !important; cursor: not-allowed; border-color: #1e293b !important; text-align: center; }
    
    .chk-center { text-align: center; }
    .chk-center input { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚔️ Another Guild CTA ⚔️</h1>
    <button class="btn-reset" onclick="resetAll()">전체 초기화</button>
  </div>

  <!-- 파티 선택 탭 -->
  <div id="party-tabs" class="party-tabs"></div>

  <!-- 엑셀시트 테이블 -->
  <div class="excel-container">
    <table class="sheet-table">
      <thead>
        <tr>
          <th style="width: 50px; text-align: center;">순번</th>
          <th style="width: 110px; text-align: center;">무기</th>
          <th style="width: 150px; text-align: center;">코멘트</th>
          <th style="width: 75px; text-align: center;">길드</th>
          <th style="width: 160px; text-align: center;">닉네임</th>
          <th style="width: 50px; text-align: center;">출석</th>
        </tr>
      </thead>
      <tbody id="sheet-body"></tbody>
    </table>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // 🔒 새로고침 시 세션이 만료되도록 일회성 플래그 검사
    if (sessionStorage.getItem('just_logged_in') !== 'true') {
      window.location.href = '/login';
    } else {
      sessionStorage.removeItem('just_logged_in');
    }

    const socket = io();
    let currentData = { slots: [], guilds: [] };
    let activeParty = '';

    socket.on('dataUpdated', (data) => {
      currentData = data;
      render();
    });

    function render() {
      const parties = {};
      currentData.slots.forEach(slot => {
        if (!parties[slot.party]) parties[slot.party] = [];
        parties[slot.party].push(slot);
      });

      const partyNames = Object.keys(parties);
      if (partyNames.length === 0) return;
      if (!activeParty || !parties[activeParty]) activeParty = partyNames[0];

      // 1. 파티 탭 그리기
      const tabsContainer = document.getElementById('party-tabs');
      tabsContainer.innerHTML = '';
      partyNames.forEach(pName => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${pName === activeParty ? 'active' : ''}`;
        btn.innerText = pName;
        btn.onclick = () => { activeParty = pName; render(); };
        tabsContainer.appendChild(btn);
      });

      // 2. 선택된 파티 엑셀 표 그리기
      const tbody = document.getElementById('sheet-body');
      tbody.innerHTML = '';

      const currentSlots = parties[activeParty] || [];
      currentSlots.forEach((slot, idx) => {
        const guildOptions = currentData.guilds.map(g => 
          `<option value="${g}" ${(slot.guild || 'ANT') === g ? 'selected' : ''}>${g}</option>`
        ).join('');

        const itemCode = slot.itemCode || ''; 
        const itemImgUrl = `https://render.albiononline.com/v1/item/${itemCode}`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align: center; font-weight: bold; color: #94a3b8; white-space: nowrap;">${slot.displayIndex || (idx + 1)}번</td>
          <td>
            <div class="weapon-cell">
              <img src="${itemImgUrl}" alt="Item" class="item-img" onerror="this.src='https://render.albiononline.com/v1/item/T8_MAIN_SWORD'" />
              <span style="font-size: 0.82rem; font-weight: bold; color: #38bdf8;">${itemCode}</span>
            </div>
          </td>
          <td>
            <input type="text" class="readonly-comment" value="${escapeHtml(slot.comment || '')}" disabled />
          </td>
          <td>
            <select onchange="updateSlot('${slot.id}', 'guild', this.value)">
              ${guildOptions}
            </select>
          </td>
          <td>
            <input type="text" placeholder="닉네임 입력" value="${escapeHtml(slot.nickname)}" onchange="updateSlot('${slot.id}', 'nickname', this.value)" />
          </td>
          <td class="chk-center">
            <input type="checkbox" ${slot.attended ? 'checked' : ''} onchange="updateSlot('${slot.id}', 'attended', this.checked)" />
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateSlot(id, key, value) {
      const slot = currentData.slots.find(s => s.id === id);
      if (slot) {
        slot[key] = value;
        socket.emit('updateSlot', slot);
      }
    }

    function resetAll() {
      if (confirm('모든 데이터를 초기화하시겠습니까?')) {
        socket.emit('resetData');
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Another Guild Loading...</title>
  <style>
    body {
      background-color: #0f172a;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInOut 2s ease-in-out forwards;
    }

    /* 📌 이미지와 텍스트를 감싸는 컨테이너 (position: relative 기준점) */
    .logo-container {
      position: relative;
      text-align: center;
      margin-bottom: 24px;
      display: inline-block;
    }
    
    .logo-container img {
      max-width: 80vw;
      max-height: 50vh;
      object-fit: contain;
      display: block;
    }

    /* 📌 중앙 이미지 오른쪽 하단에 얹어지는 made by HonamKing 문구 */
    .image-watermark {
      position: absolute;
      right: 8px;
      bottom: 6px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* 📌 로딩바 (키워드 요청대로 크기 확대 적용) */
    .progress-bar-container {
      width: 280px;
      height: 10px;
      background-color: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #38bdf8;
      border-radius: 5px;
      transition: width 2s linear;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.95); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- 중앙 로고 및 로딩바 컨테이너 -->
  <div class="center-wrapper">
    <div class="logo-container">
      <img src="/images/logo.png" alt="Guild Logo">
      <!-- 📌 이미지 오른쪽 하단 위에 덧붙여진 문구 -->
      <div class="image-watermark">made by HonamKing</div>
    </div>
    
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('progressBar').style.width = '100%';
      }, 50);
    });

    // 2초 후 로그인 페이지로 자동 이동
    setTimeout(() => {
      window.location.href = '/login';
    }, 2000);
  </script>

  <!-- 📌 공통 footer.js 스크립트 연동 (우측 하단 CuroNova 크레딧 자동 생성) -->
  <script src="/js/footer.js"></script>
</body>
</html>

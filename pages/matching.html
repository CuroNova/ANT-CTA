<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Another Guild CTA</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    
    /* 📌 상단 헤더 영역 (중앙 제목, 좌측 길드현황, 우측 갑옷현황) */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; position: relative; }
    h1 { margin: 0 auto; font-size: 1.5rem; color: #38bdf8; position: absolute; left: 50%; transform: translateX(-50%); text-align: center; }
    @media (max-width: 1200px) {
      h1 { position: static; transform: none; margin: 0 auto; width: 100%; order: -1; }
    }
    
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-left: auto; }
    @media (max-width: 1200px) {
      .header-right { margin-left: 0; }
    }

    /* 요약 박스 공통 스타일 */
    .summary-box {
      display: flex;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.82rem;
    }
    .summary-item {
      padding: 6px 10px;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .summary-item:last-child { border-right: none; }
    .summary-label { color: #94a3b8; font-weight: 500; }
    
    /* 0개/명일 때 공통 붉은색 계열 */
    .zero-count { color: #f43f5e; font-weight: bold; font-size: 0.95rem; }
    
    /* 갑옷 1개 이상일 때 기본 흰색 */
    .armor-count-active { color: #f8fafc; font-weight: bold; font-size: 0.95rem; }

    /* 첫 번째 길드 1명 이상일 때 초록색 */
    .guild-first-active { color: #22c55e; font-weight: bold; font-size: 0.95rem; }

    /* 두 번째 길드부터 1명 이상일 때 보라색 */
    .guild-other-active { color: #a855f7; font-weight: bold; font-size: 0.95rem; }

    .btn-reset { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; height: 35px; white-space: nowrap; }
    .btn-reset:hover { background-color: #dc2626; }

    /* 📌 탭 영역과 전체 초기화 버튼을 한 줄에 배치 */
    .nav-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; padding-bottom: 4px; }
    .party-tabs { display: flex; gap: 8px; overflow-x: auto; border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 0.95rem; white-space: nowrap; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .side-by-side-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 1400px) {
      .side-by-side-grid {
        grid-template-columns: 1fr; 
      }
    }

    .party-sub-title { color: #38bdf8; font-weight: bold; font-size: 1.1rem; margin: 0 0 8px 2px; }

    .excel-container { overflow-x: auto; background: #1e293b; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
    table.sheet-table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; }
    table.sheet-table th { background: #0f172a; color: #38bdf8; padding: 10px 8px; font-size: 0.88rem; border-bottom: 2px solid #334155; border-right: 1px solid #1e293b; white-space: nowrap; }
    table.sheet-table td { padding: 6px 8px; border-bottom: 1px solid #334155; border-right: 1px solid #1e293b; vertical-align: middle; }
    table.sheet-table tr:hover { background-color: #273549; }

    .gear-cell { display: flex; align-items: center; justify-content: flex-start; gap: 6px; white-space: nowrap; overflow: hidden; }
    .gear-img { width: 32px; height: 32px; object-fit: contain; background: #0f172a; border-radius: 4px; border: 1px solid #334155; padding: 2px; flex-shrink: 0; }

    input[type="text"], select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 5px 6px; border-radius: 4px; font-size: 0.85rem; }
    select { padding-right: 2px; text-align: center; }
    .readonly-comment { background-color: #090d16 !important; color: #64748b !important; cursor: not-allowed; border-color: #1e293b !important; text-align: center; }
    
    .chk-center { text-align: center; }
    .chk-center input { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
  </style>
</head>
<body>

  <div class="header">
    <!-- 📌 좌측 맨끝: 길드별 인원 집계 현황판 -->
    <div class="header-left">
      <div id="guild-summary" class="summary-box"></div>
    </div>

    <!-- 📌 정중앙: 제목 -->
    <h1>⚔️ Another Guild CTA ⚔️</h1>

    <!-- 📌 우측: 갑옷 종류별 인원 집계 현황판 -->
    <div class="header-right">
      <div id="armor-summary" class="summary-box"></div>
    </div>
  </div>

  <!-- 📌 탭 영역과 전체 초기화 버튼을 감싸는 바 (탭 맨 오른쪽에 초기화 버튼 위치) -->
  <div class="nav-container">
    <div id="party-tabs" class="party-tabs"></div>
    <button class="btn-reset" onclick="requestReset()">전체 초기화</button>
  </div>

  <div id="sheet-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    if (sessionStorage.getItem('just_logged_in') !== 'true') {
      window.location.href = '/login';
    } else {
      sessionStorage.removeItem('just_logged_in');
    }

    const socket = io();
    let currentData = { slots: [], guilds: [] };
    let activeTabLabel = '';

    socket.on('dataUpdated', (data) => {
      currentData = data;
      render();
    });

    function getRoleColor(role) {
      if (!role) return '#38bdf8';
      const trimmed = role.trim();
      switch (trimmed) {
        case '디펜': return '#38bdf8'; // 파랑색
        case '오펜': return '#a855f7'; // 보라색
        case '서폿': return '#eab308'; // 노란색
        case '딜러': return '#ef4444'; // 빨간색
        case '힐러': return '#22c55e'; // 초록색
        default: return '#38bdf8';
      }
    }

    function render() {
      const parties = {};
      currentData.slots.forEach(slot => {
        if (!parties[slot.party]) parties[slot.party] = [];
        parties[slot.party].push(slot);
      });

      const allPartyNames = Object.keys(parties);
      if (allPartyNames.length === 0) return;

      const guildCounts = {};
      currentData.guilds.forEach(g => guildCounts[g] = 0);
      
      const armorTargets = ['심판관', '데몬', '기사', '가디언', '더스크'];
      const armorCounts = { '심판관': 0, '데몬': 0, '기사': 0, '가디언': 0, '더스크': 0 };

      currentData.slots.forEach(slot => {
        if (slot.nickname && slot.nickname.trim() !== '') {
          const gName = slot.guild || 'ANT';
          if (guildCounts[gName] !== undefined) {
            guildCounts[gName]++;
          } else {
            guildCounts[gName] = 1;
          }

          const aName = slot.armorName || '';
          armorTargets.forEach(target => {
            if (aName.includes(target)) {
              armorCounts[target]++;
            }
          });
        }
      });

      // 길드 요약 UI 렌더링
      const guildSummaryContainer = document.getElementById('guild-summary');
      guildSummaryContainer.innerHTML = '';
      currentData.guilds.forEach((g, index) => {
        const count = guildCounts[g] || 0;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'summary-item';

        let countClass = 'zero-count';
        if (count > 0) {
          countClass = (index === 0) ? 'guild-first-active' : 'guild-other-active';
        }

        itemDiv.innerHTML = `
          <span class="summary-label">${g}</span>
          <span class="${countClass}">${count}명</span>
        `;
        guildSummaryContainer.appendChild(itemDiv);
      });

      // 갑옷 요약 UI 렌더링
      const armorSummaryContainer = document.getElementById('armor-summary');
      armorSummaryContainer.innerHTML = '';
      armorTargets.forEach(a => {
        const count = armorCounts[a] || 0;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'summary-item';

        const countClass = count > 0 ? 'armor-count-active' : 'zero-count';

        itemDiv.innerHTML = `
          <span class="summary-label">${a}</span>
          <span class="${countClass}">${count}개</span>
        `;
        armorSummaryContainer.appendChild(itemDiv);
      });

      const tabs = [];
      const p12 = allPartyNames.filter(p => p === '1파티' || p === '2파티' || p === '1' || p === '2');
      if (p12.length > 0) tabs.push({ label: '1·2파티', parties: p12 });

      const p3Free = [];
      if (parties['3파티']) p3Free.push('3파티');
      else {
        allPartyNames.forEach(p => {
          if (p.includes('3') && p !== 'FREE ROLE') p3Free.push(p);
        });
      }
      if (parties['FREE ROLE']) p3Free.push('FREE ROLE');
      if (p3Free.length > 0) tabs.push({ label: '3파티 · FREE ROLE', parties: p3Free });

      allPartyNames.forEach(p => {
        if (!p12.includes(p) && !p3Free.includes(p)) {
          tabs.push({ label: p, parties: [p] });
        }
      });

      if (tabs.length === 0) {
        allPartyNames.forEach(p => tabs.push({ label: p, parties: [p] }));
      }

      if (!activeTabLabel || !tabs.find(t => t.label === activeTabLabel)) {
        activeTabLabel = tabs[0].label;
      }

      const tabsContainer = document.getElementById('party-tabs');
      tabsContainer.innerHTML = '';
      tabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${tab.label === activeTabLabel ? 'active' : ''}`; btn.innerText = tab.label; btn.onclick = () => { activeTabLabel = tab.label; render(); }; tabsContainer.appendChild(btn); });  const container = document.getElementById('sheet-container'); container.innerHTML = '';  const currentTab = tabs.find(t => t.label === activeTabLabel) \vert{}\vert{} tabs[0]; const isMulti = currentTab.parties.length > 1;  const gridWrapper = document.createElement('div'); gridWrapper.className = isMulti ? 'side-by-side-grid' : ''; container.appendChild(gridWrapper);  currentTab.parties.forEach(partyName => { const partySlots = parties[partyName] \vert{}\vert{} []; if (partySlots.length === 0) return;  const partyColumn = document.createElement('div');  const maxCount = partySlots.length; const currentCount = partySlots.filter(s => s.nickname && s.nickname.trim() !== '').length;  if (isMulti \vert{}\vert{} currentTab.parties.length === 1) { const subTitle = document.createElement('div'); subTitle.className = 'party-sub-title'; subTitle.innerText = `📌 ${partyName} (${currentCount} /${maxCount})`;
          partyColumn.appendChild(subTitle);
        }

        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'excel-container';

        let tbodyHtml = '';
        partySlots.forEach((slot, idx) => {
          const guildOptions = currentData.guilds.map(g => 
            `<option value="${g}" ${(slot.guild \vert{}\vert{} 'ANT') === g ? 'selected' : ''}>${g}</option>`
          ).join('');

          const weaponImgUrl = (slot.weaponImg && slot.weaponImg.trim() !== '') ? slot.weaponImg : '/images/default_weapon.png';
          const armorImgUrl = (slot.armorImg && slot.armorImg.trim() !== '') ? slot.armorImg : '/images/default_armor.png';
          
          const formattedIndex = String(slot.displayIndex || (idx + 1)).padStart(2, '0');
          const weaponName = slot.weaponName || '';
          const armorName = slot.armorName || '';

          tbodyHtml += `

              <td style="width: 45px; text-align:

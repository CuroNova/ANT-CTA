<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Another Guild Loading...</title>
  <style>
    body {
      background-color: #0f172a;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInOut 2s ease-in-out forwards;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container img {
      max-width: 80vw;
      max-height: 50vh;
      object-fit: contain;
    }

    /* 📌 진짜 로딩바 스타일 */
    .progress-bar-container {
      width: 200px;
      height: 6px;
      background-color: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #38bdf8;
      border-radius: 3px;
      /* 2초 동안 부드럽게 차오르도록 설정 */
      transition: width 2s linear;
    }

    /* 📌 우측 최하단 크레딧 */
    .footer-credit {
      position: fixed;
      right: 20px;
      bottom: 16px;
      color: #475569;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.95); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- 중앙 로고 및 로딩바 컨테이너 -->
  <div class="center-wrapper">
    <div class="logo-container">
      <img src="/images/logo.png" alt="Guild Logo">
    </div>
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- 우측 하단 크레딧 -->
  <div class="footer-credit">made by CuroNova</div>

  <script>
    // 페이지가 열리자마자 로딩바를 100%까지 채우기 시작
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('progressBar').style.width = '100%';
      }, 50); // 미세한 렌더링 딜레이 후 애니메이션 작동
    });

    // 2초 후 로그인 페이지로 자동 이동
    setTimeout(() => {
      window.location.href = '/login';
    }, 2000);
  </script>
</body>
</html>

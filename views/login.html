<div class="login-view" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div class="login-card" style="background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; text-align: center; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    <h1 style="font-size: 24px; margin-bottom: 8px; color: #38bdf8;">Another Guild CTA</h1>
    <p class="cta" style="font-size: 14px; color: #94a3b8; margin-bottom: 30px;">접속하려면 초대코드를 입력하세요</p>
    <form id="loginForm">
      <input type="password" id="inviteCode" placeholder="🔑 초대코드 입력" required autocomplete="current-password" autofocus style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 16px; margin-bottom: 20px; text-align: center;" />
      <button type="submit" style="width: 100%; padding: 12px; background: #38bdf8; border: none; color: #0f172a; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">접속</button>
      <div id="error-msg" class="error-msg" style="color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none;">초대코드가 올바르지 않습니다.</div>
    </form>
  </div>
</div>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Another Guild Login</title>
  <!-- 📌 전역 공통 헤더/파비콘 스크립트 연동 -->
  <script src="/js/header.js"></script>
  <!-- 📌 CSS 파일 분리 연동 -->
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <div class="login-card">
    <h1>Another Guild CTA</h1>
    <p class="cta">접속하려면 초대코드를 입력하세요</p>
    <form id="loginForm">
      <input type="password" id="inviteCode" placeholder="🔑 초대코드 입력" required autocomplete="current-password" autofocus>
      <button type="submit">접속</button>
      <div id="error-msg" class="error-msg">초대코드가 올바르지 않습니다.</div>
    </form>
  </div>

  <!-- 📌 JS 기능 파일 분리 연동 -->
  <script src="/js/login.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Another Guild CTA</title>
  
  <!-- 📌 전역 공통 헤더/파비콘 주입 스크립트 연동 -->
  <script src="/js/header.js"></script>

  <!-- 📌 CSS 파일 분리 연동 -->
  <link rel="stylesheet" href="/css/matching.css">
</head>
<body>

  <div class="header">
    <div class="header-left"></div>
    <!-- 📌 정중앙 배치된 H1 제목 및 독립된 data-utc-clock 시계 적용 -->
    <div class="header-center">
      <h1>⚔️ Another Guild CTA ⚔️</h1>
      <div data-utc-clock class="utc-clock">UTC --:--:--</div>
    </div>
    <div class="header-right">
      <!-- 📌 길드별 인원 집계 현황판 -->
      <div id="guild-summary" class="summary-box"></div>
      <!-- 📌 갑옷 종류별 인원 집계 현황판 -->
      <div id="armor-summary" class="summary-box"></div>
    </div>
  </div>

  <div id="party-tabs" class="party-tabs"></div>
  <div id="sheet-container"></div>

  <!-- 📌 소켓 및 JS 기능 파일 분리 연동 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/matching.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>

<div class="welcome-view" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; position: relative;">

    <div class="logo-container" style="position: relative; text-align: center; margin-bottom: 24px; display: inline-block;">
      <img src="/images/logo.png" alt="Guild Logo" style="max-width: 80vw; max-height: 50vh; object-fit: contain; display: block;" onerror="this.style.display='none'" />
      <div class="image-watermark" style="position: absolute; right: 8px; bottom: 6px; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.03em; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9); pointer-events: none;">made by HonamKing</div>

<style>
  @keyframes fadeInOut {
    0% { opacity: 0; transform: scale(0.95); }

    80% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }
